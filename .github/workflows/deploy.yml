# GitHub Pages ya NO sirve la web: desde el 16-08-2026 vive en
# https://idoctormusic.com (Firebase Hosting, `npm run deploy` desde local).
# Este workflow publica en Pages un sitio de SOLO REDIRECCIÓN (canonical +
# meta refresh + JS) para que las URLs antiguas idoctor2000.github.io/… sigan
# funcionando y Google traspase la autoridad al dominio nuevo.
name: Deploy redirect site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REDIRECT_TARGET: https://idoctormusic.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build redirect site
        run: node scripts/build-redirect-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
